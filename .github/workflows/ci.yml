name: TokoAI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Run Pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/tokoai"
        REDIS_URL: "redis://localhost:6379/0"
        GEMINI_API_KEY: "mock_gemini_api_key"
        TIKTOK_APP_SECRET: "dev_secret_key_123"
        TIKTOK_ACCESS_TOKEN: "mock_tiktok_access_token"
        BAKONG_MERCHANT_ID: "tokoai@dev"
        BAKONG_ACCOUNT_NAME: "TOKOAI STORE"
      run: |
        # Set PYTHONPATH so absolute imports work
        PYTHONPATH=. pytest tests/ -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json
        
    - name: Install and Build
      working-directory: ./frontend
      env:
        NEXT_TELEMETRY_DISABLED: 1
      run: |
        npm install
        npm run build

