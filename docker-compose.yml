version: '3.8'

services:
  # Database with pgvector extension for AI search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tokoai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tokoai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  # Redis for ARQ worker queues and rate limiting
  redis:
    image: redis:7-alpine
    container_name: tokoai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # FastAPI Backend Service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: tokoai_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tokoai
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: always

  # ARQ Python Background Worker (for AI agent generation)
  worker:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: tokoai_worker
    env_file:
      - .env
    command: ["arq", "app.worker.worker.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tokoai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: always

  # Next.js Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tokoai_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
